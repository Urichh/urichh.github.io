title: "Blog @ urbansite.si"
description: "Personal blog"

url: "https://www.urbansite.si"
baseurl: "/blog/"

remote_theme: abhinavs/moonwalk
theme_config:
  appearance: dark
  appearance_toggle: true
  date_format: "%B %d, %Y"

permalink: /:year/:month/:day/:title/

custom_css:
  - /assets/css/terminal.css

plugins:
  - jekyll-paginate
  - jekyll-feed
  - jekyll-markdown-output
  - jekyll-llms-output
  - jekyll-remote-theme
  - jekyll-seo-tag
  - jekyll-soopr-seo-tag
  - jekyll-sitemap

paginate: 5
paginate_path: "/page:num"