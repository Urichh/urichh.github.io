<h1>{{ page.title }}</h1>

<p>You can check out some of by recent blog post here.</p>

<h2>Recent posts</h2>
<ul>
	{%- for post in site.posts -%}
	<li>
		<a href="{{ post.url | relative_url }}">{{ post.title }}</a>
		<span style="color: #888">— {{ post.date | date: "%B %d, %Y" }}</span>
	</li>
	{%- endfor -%}
</ul>
